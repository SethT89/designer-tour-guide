name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days with no activity. A weekly hit to
# /api/health runs a query against the database and keeps it awake.

on:
  schedule:
    - cron: "17 14 * * 1" # 14:17 UTC every Monday
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health endpoint
        run: |
          set -euo pipefail
          url="https://designer-tour-guide.sethmthomas89.workers.dev/api/health"
          echo "GET $url"
          body="$(curl -sS --fail --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
